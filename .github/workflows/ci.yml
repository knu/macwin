name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SwiftLint
        run: |
          set -euo pipefail
          brew install swiftlint

      - name: Run SwiftLint
        run: |
          set -euo pipefail
          swiftlint

      - name: Test
        run: |
          set -euo pipefail
          swift test

      - name: Build
        run: |
          set -euo pipefail
          swift build
